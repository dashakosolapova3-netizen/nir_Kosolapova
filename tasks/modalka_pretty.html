<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заказа - Samsung Galaxy S25 Ultra</title>
  <style>
    :root { --primary: #e31e24; --secondary: #c41218; --error: #e74c3c; --bg: #f5f7fa; --text: #2c3e50; --radius: 12px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; }
    .container { max-width: 700px; margin: auto; background: #fff; padding: 30px; border-radius: var(--radius); box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    
    .order-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
    .product-thumb { width: 80px; height: 100px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; }
    .product-info h2 { color: var(--primary); margin-bottom: 5px; }
    .product-info .price { font-size: 24px; font-weight: bold; color: var(--text); }
    .product-info .old-price { text-decoration: line-through; color: #999; margin-left: 10px; }
    
    h1 { text-align: center; margin-bottom: 25px; color: var(--primary); font-size: 28px; }
    .form-section { margin-bottom: 25px; padding: 20px; background: #fafafa; border-radius: 8px; }
    .form-section h3 { margin-bottom: 15px; color: var(--text); font-size: 16px; border-left: 4px solid var(--primary); padding-left: 12px; }
    
    .form-group { margin-bottom: 15px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; }
    input[type="text"], input[type="tel"], input[type="email"], select { width: 100%; padding: 12px 14px; border: 2px solid #ddd; border-radius: var(--radius); font-size: 14px; transition: border-color .3s; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    
    .radio-group { display: flex; flex-direction: column; gap: 10px; }
    .radio-item { display: flex; align-items: center; gap: 10px; padding: 12px; background: #fff; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: all .2s; }
    .radio-item:hover { border-color: var(--primary); }
    .radio-item input[type="radio"] { width: 18px; height: 18px; accent-color: var(--primary); }
    .radio-item.active { border-color: var(--primary); background: #fff5f5; }
    
    .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; }
    .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--primary); }
    .checkbox-group label { font-weight: 400; cursor: pointer; font-size: 13px; color: #666; }
    
    .btn { padding: 14px 24px; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; transition: .2s; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--secondary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(227,30,36,.4); }

    /* --- МОДАЛКА --- */
    .modal { 
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: 20px;
    }
    .modal:not(.hidden) { opacity: 1; }
    .modal.hidden { display: none; }

    .modal-box { 
      background: #fff; 
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      transform: scale(0.9) translateY(20px);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }
    .modal:not(.hidden) .modal-box { transform: scale(1) translateY(0); }

    .modal-head { 
      padding: 24px 28px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      gap: 12px;
    }
    .modal-head h3 { 
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }
    .modal-head svg { flex-shrink: 0; }
    
    .modal-close { 
      background: rgba(255, 255, 255, 0.2);
      border: none; 
      width: 32px; 
      height: 32px;
      border-radius: 50%;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      line-height: 1;
      padding: 0;
    }
    .modal-close:hover { 
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(90deg);
    }

    .modal-body { padding: 28px; background: #fff; }
    .modal-body ul { list-style: none; margin: 0; padding: 0; }
    .modal-body li { 
      padding: 14px 16px;
      margin-bottom: 10px;
      background: #fff5f5;
      border-left: 4px solid var(--error);
      border-radius: 8px;
      color: #c53030;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .modal-body li:hover {
      background: #fed7d7;
      transform: translateX(4px);
    }
    .modal-body li:last-child { margin-bottom: 0; }
    .modal-body li svg { flex-shrink: 0; margin-top: 2px; }

    .modal-foot { 
      padding: 20px 28px;
      border-top: 1px solid #e2e8f0;
      text-align: right;
      background: #f7fafc;
    }
    .btn-secondary { 
      background: #fff;
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 10px 28px;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover { 
      background: var(--primary);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(227,30,36, 0.3);
    }
    .btn-secondary:active { transform: translateY(0); }
    
    .order-summary { background: #fff5f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .order-summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .order-summary-row.total { font-weight: bold; font-size: 18px; border-top: 2px solid var(--primary); padding-top: 8px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="order-header">
      <div class="product-thumb">📱</div>
      <div class="product-info">
        <h2>Samsung Galaxy S25 Ultra</h2>
        <div class="price">89 990 ₽ <span class="old-price">109 990 ₽</span></div>
      </div>
    </div>
    
    <h1>Оформление заказа</h1>
    
    <form id="form-modal" novalidate>
      <div class="form-section">
        <h3> Контактные данные</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Ваше имя *</label>
            <input type="text" name="name" placeholder="Иван Иванов" required>
          </div>
          <div class="form-group">
            <label>Телефон *</label>
            <input type="tel" name="phone" placeholder="+7 (999) 999-99-99" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" name="email" placeholder="example@mail.ru" required>
        </div>
      </div>
      
      <div class="form-section">
        <h3>Адрес доставки</h3>
        <div class="form-group">
          <label>Город *</label>
          <input type="text" name="city" placeholder="Москва" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Улица *</label>
            <input type="text" name="street" placeholder="ул. Примерная" required>
          </div>
          <div class="form-group">
            <label>Дом *</label>
            <input type="text" name="house" placeholder="10" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Квартира/Офис</label>
            <input type="text" name="apartment" placeholder="25">
          </div>
          <div class="form-group">
            <label>Индекс</label>
            <input type="text" name="zip" placeholder="123456">
          </div>
        </div>
      </div>
      
      <div class="form-section">
        <h3>Способ оплаты</h3>
        <div class="radio-group" name="payment">
          <label class="radio-item">
            <input type="radio" name="payment" value="card" required>
            <span>Банковской картой онлайн</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="payment" value="cash">
            <span>Наличными при получении</span>
          </label>
        </div>
      </div>
      
      <div class="order-summary">
        <div class="order-summary-row">
          <span>Стоимость товара:</span>
          <span>89 990 ₽</span>
        </div>
        <div class="order-summary-row">
          <span>Доставка:</span>
          <span>Бесплатно</span>
        </div>
        <div class="order-summary-row total">
          <span>Итого к оплате:</span>
          <span>89 990 ₽</span>
        </div>
      </div>
      
      <div class="checkbox-group">
        <input type="checkbox" name="agree" id="agree" required>
        <label for="agree">Я согласен с условиями покупки и политикой конфиденциальности *</label>
      </div>
      
      <button type="submit" class="btn btn-primary" style="margin-top: 20px;">Оформить заказ</button>
    </form>
  </div>

  <div id="error-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h3>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Проверьте данные заказа
        </h3>
        <button class="modal-close" aria-label="Закрыть">&times;</button>
      </div>
      <div class="modal-body">
        <ul id="error-list"></ul>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" id="modal-ok">Исправить ошибки</button>
      </div>
    </div>
  </div>

  <!--СБОР ДАННЫХ: Начало скрипта с логированием -->
  <script>
    // === СЧЁТЧИК И ФУНКЦИЯ ОТПРАВКИ СОБЫТИЙ ===
    let modalShowCount = 0;

    function logToParent(eventName, extraData = {}) {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({
                type: 'experiment_event',
                eventName: eventName,
                timestamp: Date.now(),
                taskId: 'phone_order_modal',
                modal_instance: modalShowCount,
                modal_version: 'modal_checkout',
                ...extraData
            }, '*');
        }
        console.log(`Сохраняем: [${eventName}]`, extraData);
    }

    // === ПРАВИЛА ВАЛИДАЦИИ ===
    const phoneRegex = /^[\d\s\-\+\(\)]{10,20}$/;
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    
    const rules = {
      name: v => v && v.trim().length >= 2 ? null : 'Введите имя (минимум 2 символа)',
      phone: v => v && phoneRegex.test(v) && v.length >= 10 ? null : 'Введите корректный номер телефона',
      email: v => v && emailRegex.test(v) ? null : 'Введите корректный email',
      city: v => v && v.trim().length >= 2 ? null : 'Укажите город',
      street: v => v && v.trim().length >= 3 ? null : 'Укажите улицу',
      house: v => v && v.trim().length >= 1 ? null : 'Укажите номер дома',
      payment: els => Array.from(els||[]).some(e=>e.checked) ? null : 'Выберите способ оплаты',
      agree: v => v ? null : 'Необходимо согласие с условиями'
    };
    
    const $ = s => document.querySelector(s);
    const $$ = s => document.querySelectorAll(s);
    
    // === ПОКАЗ МОДАЛКИ ===
    const showModal = errs => {
      modalShowCount++;
      
      const errorIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
      $('#error-list').innerHTML = errs.map(e => `<li>${errorIcon}<span>${e}</span></li>`).join('');
      $('#error-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      
      logToParent('modal_shown', {
        instance_id: `modal_${modalShowCount}`,
        instance_number: modalShowCount,
        error_count: errs.length,
        errors: errs,
        trigger: 'form_submit'
      });
    };
    
    // === СКРЫТИЕ МОДАЛКИ ===
    const hideModal = (closedBy = 'auto') => { 
      $('#error-modal').classList.add('hidden'); 
      document.body.style.overflow = '';
      
      logToParent('modal_closed', {
        instance_id: `modal_${modalShowCount}`,
        instance_number: modalShowCount,
        closed_by: closedBy
      });
    };

    // === ОБРАБОТЧИК ОТПРАВКИ ФОРМЫ ===
    $('#form-modal').onsubmit = e => {
      e.preventDefault();
      
      logToParent('form_submit', {
        form_data: {
          name_filled: e.target.name.value.trim().length > 0,
          phone_filled: e.target.phone.value.trim().length > 0,
          email_filled: e.target.email.value.trim().length > 0,
          city_filled: e.target.city.value.trim().length > 0,
          street_filled: e.target.street.value.trim().length > 0,
          house_filled: e.target.house.value.trim().length > 0,
          payment_selected: Array.from(e.target.payment || []).some(p => p.checked),
          agree_checked: e.target.agree.checked
        }
      });
      
      const f = e.target;
      const data = { 
        name: f.name.value, 
        phone: f.phone.value,
        email: f.email.value,
        city: f.city.value,
        street: f.street.value,
        house: f.house.value,
        payment: f.querySelectorAll('[name="payment"]'),
        agree: f.agree.checked 
      };
      
      const errors = Object.entries(rules).map(([k,fn]) => fn(data[k])).filter(Boolean);
      errors.length ? showModal(errors) : (alert('Заказ успешно оформлен!'), f.reset());
    };

    // === ОБРАБОТЧИКИ ЗАКРЫТИЯ МОДАЛКИ ===
    $('#modal-ok').addEventListener('click', () => hideModal('button'));
    $('.modal-close').addEventListener('click', () => hideModal('button'));
    $('#error-modal').addEventListener('click', e => { 
        if(e.target.id==='error-modal') hideModal('overlay'); 
    });
    document.addEventListener('keydown', e => { 
        if(e.key==='Escape') hideModal('escape'); 
    });
    
    // === АКТИВАЦИЯ РАДИО-КНОПОК ===
    $$('.radio-item').forEach(item => {
      item.addEventListener('click', function() {
        $$('.radio-item').forEach(i => i.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>
</body>
</html>
